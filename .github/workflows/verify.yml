name: Verify assessment
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            cloudflare/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: npm --prefix frontend ci
      - run: npm --prefix cloudflare ci
      - run: ruff check backend scripts
      - run: ruff format --check backend scripts
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test routing -v 2
      - run: python scripts/evaluate_scenarios.py
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: npm --prefix cloudflare run check
      - run: npm --prefix cloudflare run dry-run
      - run: python backend/manage.py collectstatic --noinput
      - name: Verify the native Railway build and start commands
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build.sh
          PORT=8001 python scripts/serve.py &
          native_pid=$!
          trap 'kill "$native_pid"' EXIT
          python scripts/wait_for_server.py http://127.0.0.1:8001/api/health
          python scripts/production_smoke.py http://127.0.0.1:8001
      - name: Build and smoke-test the deployment image
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag weather-routing:ci .
          docker run --detach --name weather-routing-ci --publish 8000:8000 \
            --env SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" \
            --env ALLOWED_HOSTS=localhost,127.0.0.1 weather-routing:ci
          trap 'docker rm --force weather-routing-ci >/dev/null' EXIT
          python scripts/wait_for_server.py http://127.0.0.1:8000/api/health
          python scripts/production_smoke.py
